# ФСП Карьера — полный стенд одной командой:  docker compose up --build
#   Приложение:        http://localhost:8080
#   API (Swagger):     http://localhost:8080/docs
#   Почта (Mailpit):   http://localhost:8025   — письма с кодами подтверждения
#   ФСП ID (mock):     http://localhost:8090   — OIDC-провайдер (пути как у Keycloak) и реестр достижений
#   Песочница кода:    контейнер без сети — бэкенд обращается к ней через Unix-сокет на общем томе
name: fsp-career

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp_career
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_dev_password}
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_career"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  mailpit:
    <<: *common
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    mem_limit: 128m

  fsp-mock:
    <<: *common
    build: ./fsp-mock
    environment:
      PUBLIC_ISSUER: ${FSP_PUBLIC_ISSUER:-http://localhost:8090/realms/fsp}
      ALLOWED_REDIRECT_PREFIXES: ${PUBLIC_URL:-http://localhost:8080}/,http://localhost:8000/
      CLIENT_ID: fsp-career
      CLIENT_SECRET: ${FSP_CLIENT_SECRET:-fsp-career-secret}
      REGISTRY_API_KEY: ${FSP_REGISTRY_API_KEY:-registry-demo-key}
    ports:
      - "8090:8090"
    mem_limit: 192m

  sandbox:
    <<: *common
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-sandbox-demo-token}
      SANDBOX_CONCURRENCY: "2"
    network_mode: none           # без сети: ни интернета, ни других контейнеров
    volumes:
      - sandbox-sock:/run/sandbox  # Unix-сокет сервиса — единственный вход в песочницу
    init: true                   # init-процесс подбирает завершённые процессы решений
    read_only: true              # файловая система только для чтения
    tmpfs:
      - /tmp:size=64m,mode=1733  # каталоги запусков в памяти; содержимое /tmp не перечисляется
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  backend:
    <<: *common
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      fsp-mock: { condition: service_started }
      mailpit: { condition: service_started }
      sandbox: { condition: service_healthy }
    volumes:
      - sandbox-sock:/run/sandbox
    environment:
      ENVIRONMENT: docker
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}  # процессов uvicorn (нагрузочный тест — loadtest/)
      DATABASE_URL: postgresql+psycopg://fsp:${POSTGRES_PASSWORD:-fsp_dev_password}@db:5432/fsp_career
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-0123456789abcdef}
      SMTP_HOST: ${SMTP_HOST:-mailpit}  # по умолчанию — Mailpit; внешний сервер — переменные SMTP_* в .env
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@fsp-career.local}
      EMAIL_DEV_MODE: ${EMAIL_DEV_MODE:-true}
      GUEST_MODE: ${GUEST_MODE:-true}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      BACKEND_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080},http://localhost:5173
      FSP_OIDC_ISSUER: ${FSP_PUBLIC_ISSUER:-http://localhost:8090/realms/fsp}
      FSP_OIDC_INTERNAL_URL: http://fsp-mock:8090/realms/fsp
      FSP_REGISTRY_URL: http://fsp-mock:8090/registry/api/v1
      FSP_CLIENT_SECRET: ${FSP_CLIENT_SECRET:-fsp-career-secret}
      FSP_REGISTRY_API_KEY: ${FSP_REGISTRY_API_KEY:-registry-demo-key}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_CANDIDATES: ${SEED_CANDIDATES:-700}
      SANDBOX_URL: unix:///run/sandbox/sandbox.sock
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-sandbox-demo-token}
      SANDBOX_LOCAL: "false"
      # Черновики заданий от LLM (админка): по умолчанию — Ollama на хосте; недоступна — демо-режим
      LLM_BASE_URL: ${LLM_BASE_URL-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    mem_limit: 1536m  # 2 процесса uvicorn, в каждом — NLP-модели (loadtest/)

  frontend:
    <<: *common
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "8080:80"
    mem_limit: 128m

volumes:
  pgdata:
  sandbox-sock:
