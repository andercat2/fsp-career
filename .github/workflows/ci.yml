# Проверка на каждый push и pull request: автотесты бэкенда (банк заданий, сценарии, песочница, антиплагиат,
# стенд оценки подбора) и сборка фронтенда с проверкой типов.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Бэкенд — автотесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4  # задачи с кодом на JavaScript исполняются через node
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Фронтенд — типы и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
